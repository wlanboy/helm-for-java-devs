# tpl wertet Helm-Variablen (z.B. .Values.*) innerhalb der Properties-Datei aus.
spring.application.name=helloworld
server.port=8080
management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.health.show-details=always


# Datasource-URL kommt aus der ConfigMap (nicht sensitiv).
# Username und Passwort kommen via envFrom aus dem Secret als SPRING_DATASOURCE_USERNAME/_PASSWORD.
spring.datasource.url=jdbc:mysql://mysql.extern.gmk.lan:3306/restdata
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# HikariCP Connection Pool – Obergrenze an die DestinationRule maxConnections anpassen.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.username=restdata
spring.datasource.password=restdata