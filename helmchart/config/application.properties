spring.application.name={{ .Values.deploymentName }}
server.port={{ .Values.service.port }}
management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.health.show-details=always
logging.structured.format.console={{ .Values.logging.structured.format }}
{{ if .Values.mysql.external.enabled }}
# Datasource-URL kommt aus der ConfigMap (nicht sensitiv).
# Username und Passwort kommen via envFrom aus dem Secret als SPRING_DATASOURCE_USERNAME/_PASSWORD.
spring.datasource.url=jdbc:mysql://{{ .Values.mysql.external.host }}:{{ .Values.mysql.external.port }}/{{ .Values.mysql.external.database }}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# HikariCP Connection Pool – Obergrenze an die DestinationRule maxConnections anpassen.
spring.datasource.hikari.maximum-pool-size={{ .Values.mysql.external.connectionPool.maxConnections }}
{{ end }}
