{{- if .Values.mysql.external.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ .Values.deploymentName }}-mysql-external-dr
  namespace: {{ .Values.namespace }}
spec:
  {{- /* Muss exakt dem Host aus dem ServiceEntry entsprechen. */ -}}
  host: {{ .Values.mysql.external.host }}
  trafficPolicy:
    portLevelSettings:
      - port:
          number: {{ .Values.mysql.external.port }}
        {{- /* TLS-Origination: der Sidecar-Proxy baut TLS zur externen MySQL-DB auf. */ -}}
        {{- /* Der Java-Anwendung gegenüber bleibt die Verbindung unverschlüsselt (plain TCP). */ -}}
        {{- if .Values.mysql.external.tls.enabled }}
        tls:
          {{- /* SIMPLE: einseitiges TLS – Server-Zertifikat wird geprüft, kein Client-Zertifikat. */ -}}
          {{- /* MUTUAL: gegenseitiges TLS – nur wenn die MySQL-DB Client-Zertifikate verlangt. */ -}}
          mode: {{ .Values.mysql.external.tls.mode }}
          {{- /* caCertificates: Pfad zum CA-Bundle im Sidecar-Container für Zertifikatsprüfung. */ -}}
          {{- /* Leer lassen um dem System-CA-Store zu vertrauen (z.B. bei öffentlich signierten Certs). */ -}}
          {{- if .Values.mysql.external.tls.caCertificates }}
          caCertificates: {{ .Values.mysql.external.tls.caCertificates }}
          {{- end }}
        {{- end }}
    connectionPool:
      tcp:
        {{- /* Maximale parallele TCP-Verbindungen zur MySQL-DB – begrenzt Connection-Pool-Größe. */ -}}
        maxConnections: {{ .Values.mysql.external.connectionPool.maxConnections }}
        {{- /* TCP Keep-Alive: hält Verbindungen aktiv und erkennt abgebrochene Verbindungen früh. */ -}}
        tcpKeepalive:
          time: 300s
          interval: 75s
    {{- /* Circuit Breaker: schützt die App vor einer überlasteten oder ausgefallenen MySQL-DB. */ -}}
    outlierDetection:
      {{- /* Nach 5 aufeinanderfolgenden Fehlern wird der Endpunkt temporär ausgeschlossen. */ -}}
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 60s
{{- end }}
