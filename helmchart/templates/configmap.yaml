{{- range $i, $v := .Values.versions }}
{{- if $i }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  # Eine ConfigMap je Version, gespeist aus einer eigenen Properties-Datei
  # (config/application-<version>.properties) – jede Version bekommt so ihre eigene,
  # unabhängig änderbare Konfiguration (siehe versions in values.yaml).
  name: {{ $.Values.deploymentName }}-config-{{ $v.name }}
data:
  application.properties: |
    # tpl wertet Helm-Variablen (z.B. .Values.*) innerhalb der Properties-Datei aus.
{{ tpl ($.Files.Get (printf "config/application-%s.properties" $v.name)) $ | indent 4 }}
{{- end }}
