{{- /*
Eine ConfigMap je Version: gemeinsame Basis config/application.properties plus
versionsspezifische Overrides aus config/application-<version>.properties (siehe _helpers.tpl).
tpl wertet Helm-Variablen (z.B. .Values.*) innerhalb der Properties-Dateien aus.
*/}}
{{- range $i, $v := .Values.versions }}
{{- if $i }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helloworld.name" $ }}-config-{{ $v.name }}
  labels:
    {{- include "helloworld.labels" $ | nindent 4 }}
    version: {{ $v.name }}
data:
  application.properties: |
    {{- include "helloworld.properties" (dict "root" $ "version" $v) | nindent 4 }}
{{- end }}
