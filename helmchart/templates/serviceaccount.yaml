{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  # Eigener ServiceAccount statt "default" – eigene Istio-Workload-Identität (SPIFFE-ID)
  # und Grundlage für AuthorizationPolicies.
  name: {{ include "helloworld.serviceAccountName" . }}
  labels:
    {{- include "helloworld.labels" . | nindent 4 }}
# Die App spricht nicht mit der Kubernetes-API – kein Token in den Pod mounten.
automountServiceAccountToken: false
{{- end }}
