{{- if .Values.mysql.external.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helloworld.name" . }}-mysql-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helloworld.labels" . | nindent 4 }}
type: Opaque
stringData:
  # stringData: Kubernetes kodiert die Werte automatisch nach Base64 – kein manuelles Enkodieren nötig.
  # In Produktion: Werte nicht in values.yaml speichern, sondern External Secrets Operator
  # oder Sealed Secrets nutzen, um Credentials verschlüsselt im Git zu verwalten.
  SPRING_DATASOURCE_USERNAME: {{ .Values.mysql.external.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.mysql.external.password | quote }}
{{- end }}
