{{- if and .Values.mysql.external.enabled .Values.mysql.external.tls.enabled .Values.mysql.external.tls.createCaSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mysql.external.tls.credentialName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helloworld.labels" . | nindent 4 }}
type: Opaque
data:
  # Istio erwartet den Key "cacert" für TLS-Origination mit credentialName.
  # Die CA liegt außerhalb des Charts (Helm kann nur Dateien im Chart lesen) und wird
  # beim Deploy übergeben: --set-file mysql.external.tls.caCert=/local-ca/ca.pem
  cacert: {{ required "mysql.external.tls.caCert muss gesetzt sein wenn createCaSecret: true (--set-file mysql.external.tls.caCert=/local-ca/ca.pem)" .Values.mysql.external.tls.caCert | b64enc }}
{{- end }}
