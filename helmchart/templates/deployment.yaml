apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deploymentName }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- /* Unveränderlicher Selektor – Kubernetes nutzt ihn um Pods diesem Deployment zuzuordnen.
         Nachträgliche Änderungen erfordern delete+recreate des Deployments. */ -}}
  selector:
    matchLabels:
      app: {{ .Values.deploymentName }}
  template:
    metadata:
      labels:
        app: {{ .Values.deploymentName }}
        {{- /* app.kubernetes.io/* Labels: Standard für ServiceMonitor/PodMonitor-Selektoren
               des Prometheus Operators und für Grafana-Dashboard-Variablen. */ -}}
        app.kubernetes.io/name: {{ .Values.deploymentName }}
        {{- /* instance = Helm Release Name; ermöglicht mehrere Instanzen derselben App im Cluster. */ -}}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- /* version = Image Tag; wird in Grafana als Metadatum angezeigt. */ -}}
        app.kubernetes.io/version: {{ .Values.image.tag }}
    spec:
      containers:
        - name: {{ .Values.deploymentName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- /* Nur gerendert wenn extraEnv belegt ist – vermeidet leeren env-Block. */ -}}
          {{- with .Values.extraEnv }}
          env:
          {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
          {{- /* requests: garantierte Ressourcen (Scheduling-Basis).
               limits: harte Obergrenze – CPU wird gedrosselt, Memory-Überschreitung killt den Pod. */ -}}
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            {{- /* Bindet application.properties aus der ConfigMap als einzelne Datei ein (subPath),
                 ohne das gesamte /app/config-Verzeichnis zu überschreiben. */ -}}
            - name: config-volume
              mountPath: /app/config/application.properties
              subPath: application.properties
            {{- /* /tmp als emptyDir: Spring Boot und die JVM brauchen beschreibbares /tmp.
                 Ohne dieses Mount schlägt der Start in Read-Only-Filesystemen fehl. */ -}}
            - name: tmp-volume
              mountPath: /tmp
          {{- with .Values.extraVolumeMounts }}
          {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /* startupProbe: gibt dem Container Zeit zum Hochfahren (failureThreshold * periodSeconds = 60s).
               Erst danach greifen liveness- und readinessProbe. */ -}}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.service.port }}
            failureThreshold: 6
            periodSeconds: 10
          {{- /* livenessProbe: schlägt sie fehl, wird der Pod neu gestartet (Deadlock-Erkennung). */ -}}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.service.port }}
            periodSeconds: 20
          {{- /* readinessProbe: schlägt sie fehl, wird der Pod aus dem Service-Load-Balancing entfernt,
               aber nicht neu gestartet (z.B. bei temporärer DB-Nichterreichbarkeit). */ -}}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.service.port }}
            periodSeconds: 20
      volumes:
        - name: config-volume
          configMap:
            name: {{ .Values.deploymentName }}-config
        {{- /* emptyDir: leeres, flüchtiges Volume – wird beim Pod-Start erstellt und beim Stop gelöscht. */ -}}
        - name: tmp-volume
          emptyDir: {}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
