apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ .Values.deploymentName }}-dr
spec:
  # Interner Kubernetes-Servicename – Istio wendet diese Regel auf Traffic an diesen Service an.
  host: {{ .Values.deploymentName }}
  # Sichtbarkeit: gleiche Namespaces wie im VirtualService, damit das Gateway (Namespace istio-ingress)
  # diese DestinationRule auch für Subset-Routing auflösen kann, statt mesh-weit ("*") sichtbar zu sein.
  # Zusätzlich die Testclient-Namespaces, deren Sidecars die Subsets für ihr Source-Namespace-Routing
  # auflösen müssen (siehe virtualservice.yaml).
  exportTo:
  - "."
  - istio-ingress
  - istio-system
  {{- range .Values.versions }}
  - {{ .sourceNamespace }}
  {{- end }}
  trafficPolicy:
    # Circuit Breaker: fehlerhafte Pods werden temporär aus dem Load-Balancing-Pool entfernt.
    outlierDetection:
      # Nach 1 aufeinanderfolgenden 5xx-Fehlern wird der Pod als fehlerhaft markiert.
      consecutive5xxErrors: 1
      # Prüfintervall – wie oft Istio die Fehlerrate je Pod auswertet.
      interval: 10s
      # Wie lange ein fehlerhafter Pod aus dem Pool ausgeschlossen bleibt.
      baseEjectionTime: 30s
  # Subsets: ein Subset je Version aus values.yaml, selektiert über das version-Label im Deployment.
  subsets:
    {{- range .Values.versions }}
    - name: {{ .name }}
      labels:
        version: {{ .name }}
    {{- end }}
